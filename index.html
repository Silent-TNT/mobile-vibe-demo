<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>口袋开发台 — 手机上的 Vibe Coding</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111827'/%3E%3Cpath d='M8 16h16M16 8v16' stroke='%236ee7c7' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root { --ink:#101827; --muted:#697386; --line:#e6eaf0; --paper:#fff; --soft:#f5f7fb; --mint:#67e8c1; --blue:#3672ff; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:#e9edf4; font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    button,input,textarea { font:inherit; } button { cursor:pointer; border:0; } .phone { min-height:100dvh; max-width:560px; margin:auto; background:var(--paper); overflow:hidden; position:relative; }
    .screen { min-height:100dvh; padding:env(safe-area-inset-top) 20px calc(26px + env(safe-area-inset-bottom)); display:none; flex-direction:column; } .screen.active { display:flex; }
    .welcome { background:radial-gradient(circle at 94% 2%, #b6ffe9 0, transparent 30%), linear-gradient(155deg,#fff 0%,#f3f7ff 88%); }
    .top { display:flex; justify-content:space-between; align-items:center; margin:10px 0 auto; } .brand { font-weight:850; letter-spacing:-.7px; font-size:18px; display:flex; gap:8px; align-items:center; } .brand i { width:25px; height:25px; display:inline-grid; place-items:center; font-style:normal; background:var(--ink); color:var(--mint); border-radius:8px; }
    .status { color:#087b5e; background:#e5fff6; padding:7px 10px; border-radius:99px; font-size:12px; font-weight:700; }
    .welcome-main { padding:40px 0 14px; } h1 { font-size:clamp(38px,11vw,58px); line-height:1.04; letter-spacing:-2.5px; margin:0 0 16px; max-width:460px; } .lede { color:var(--muted); margin:0; line-height:1.6; font-size:16px; max-width:380px; }
    .idea-box { margin-top:30px; padding:6px; background:#fff; border:1px solid #dbe1eb; box-shadow:0 15px 35px #18233b17; border-radius:22px; } textarea { width:100%; min-height:112px; border:0; resize:none; outline:0; padding:17px; line-height:1.55; background:transparent; color:var(--ink); } textarea::placeholder { color:#96a0b1; }
    .generate { display:flex; align-items:center; justify-content:center; gap:9px; width:100%; color:#fff; background:var(--ink); border-radius:16px; padding:15px; font-weight:780; transition:.2s transform,.2s background; } .generate:active { transform:scale(.98); } .spark { color:var(--mint); font-size:20px; line-height:0; }
    .examples-label { color:var(--muted); font-size:13px; margin:24px 0 10px; } .chips { display:flex; gap:8px; overflow:auto; padding-bottom:5px; scrollbar-width:none; } .chip { white-space:nowrap; background:#fff; color:#3c485d; border:1px solid #dce2ea; padding:10px 13px; border-radius:12px; font-size:13px; font-weight:650; }
    .footnote { margin-top:auto; color:#9aa3b3; font-size:12px; text-align:center; padding-top:20px; }
    .build { align-items:center; justify-content:center; text-align:center; background:#111827; color:#fff; } .build-card { width:100%; } .orbit { width:74px; height:74px; border-radius:24px; margin:0 auto 27px; display:grid; place-items:center; color:#10201d; background:var(--mint); font-size:32px; box-shadow:0 0 0 9px #6ee7c722,0 0 0 18px #6ee7c711; animation:pulse 1.7s infinite; } @keyframes pulse { 50% { transform:scale(1.06); } }
    .build h2 { font-size:28px; margin:0 0 12px; letter-spacing:-1px; } .build p { color:#b8c1d0; margin:0 auto 30px; max-width:300px; line-height:1.6; } .steps { text-align:left; display:grid; gap:13px; } .step { background:#1b2536; border-radius:14px; padding:14px; color:#748197; font-size:14px; transition:.2s; } .step.on { color:#ecfff9; background:#24354a; } .step b { display:inline-grid; width:22px; height:22px; place-items:center; margin-right:9px; border-radius:50%; background:#334155; color:#aab6c6; font-size:12px; } .step.on b { background:var(--mint); color:#10201d; }
    .studio { padding:0; background:#f4f6fa; } .studio-head { display:flex; align-items:center; padding:calc(14px + env(safe-area-inset-top)) 17px 12px; background:#fff; border-bottom:1px solid var(--line); gap:10px; } .project-dot { width:10px; height:10px; border-radius:50%; background:#4ade80; box-shadow:0 0 0 4px #dcfce7; margin-left:4px; } .project { flex:1; min-width:0; } .project b { display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .project span { color:#8490a2; font-size:11px; } .icon-btn { background:#f3f5f9; color:#253147; height:38px; min-width:38px; border-radius:12px; font-size:17px; font-weight:800; }
    .preview-wrap { padding:14px 16px 12px; background:#fff; } .preview-label { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#718096; margin:0 1px 8px; font-weight:700; } .live { color:#078762; } .live::before { content:'●'; font-size:9px; margin-right:4px; } .app-frame { height:300px; border-radius:19px; overflow:hidden; border:1px solid #d8dee8; box-shadow:0 8px 22px #25354c18; background:white; position:relative; } .app-frame iframe { width:100%; height:100%; border:0; display:block; }
    .workspace { padding:14px 16px calc(16px + env(safe-area-inset-bottom)); flex:1; display:flex; flex-direction:column; gap:10px; } .suggestions { display:flex; gap:7px; overflow:auto; scrollbar-width:none; } .suggestions button { flex:0 0 auto; color:#526176; background:#fff; border:1px solid #dde3ec; padding:8px 10px; border-radius:10px; font-size:12px; } .change-box { background:#fff; border:1px solid #dce2ea; box-shadow:0 6px 14px #1d2a3b0c; border-radius:17px; padding:5px; display:flex; align-items:end; } .change-box textarea { min-height:45px; height:45px; padding:12px; font-size:14px; } .send { margin:5px; width:39px; height:39px; flex:0 0 39px; border-radius:12px; color:#fff; background:var(--blue); font-size:18px; } .ai-note { margin:0 4px; color:#7d899a; min-height:19px; font-size:12px; }
    .sheet-backdrop { position:absolute; inset:0; background:#11182770; z-index:4; display:none; } .sheet-backdrop.show { display:block; } .sheet { position:absolute; z-index:5; bottom:0; left:0; right:0; background:#fff; border-radius:25px 25px 0 0; padding:11px 18px calc(20px + env(safe-area-inset-bottom)); transform:translateY(105%); transition:.28s ease; max-height:86%; display:flex; flex-direction:column; } .sheet.show { transform:translateY(0); } .handle { width:40px; height:4px; border-radius:3px; background:#d9dee7; margin:0 auto 14px; } .sheet-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:13px; } .sheet-title h3 { margin:0; font-size:19px; } .close { background:#eef1f6; width:31px; height:31px; border-radius:50%; font-size:19px; color:#475569; } pre { margin:0; overflow:auto; background:#101827; color:#d9e2f2; padding:15px; border-radius:15px; font:11px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace; white-space:pre-wrap; flex:1; } .share-content { color:#627086; line-height:1.55; margin:0 0 18px; } .fake-link { background:#f3f5f9; border:1px solid #dfe5ed; padding:12px; border-radius:11px; color:#253147; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .copy { width:100%; margin-top:13px; color:#fff; background:var(--ink); border-radius:13px; padding:13px; font-weight:750; }
    @media (min-width:700px) { body { padding:22px; } .phone { min-height:calc(100dvh - 44px); border-radius:28px; box-shadow:0 30px 90px #283c5d33; } .screen { min-height:calc(100dvh - 44px); } }
  </style>
</head>
<body>
<main class="phone">
  <section class="screen welcome active" id="welcome">
    <header class="top"><div class="brand"><i>+</i>口袋开发台</div><span class="status">● 在线运行</span></header>
    <div class="welcome-main"><h1>你今天<br>想做什么？</h1><p class="lede">说出一个想法。剩下的，交给 AI 和你的手机。</p>
      <div class="idea-box"><textarea id="prompt" aria-label="描述你想制作的应用" placeholder="比如：做一个能从 10 个人里随机抽一人的小工具"></textarea><button class="generate" id="generate"><span class="spark">✦</span>开始生成</button></div>
      <p class="examples-label">试试这些想法</p><div class="chips"><button class="chip" data-app="lottery">🎲 随机抽签器</button><button class="chip" data-app="pomodoro">🍅 专注番茄钟</button><button class="chip" data-app="split">🧾 AA 计算器</button></div>
    </div><p class="footnote">一句话 → 一个能运行的东西</p>
  </section>
  <section class="screen build" id="build"><div class="build-card"><div class="orbit">✦</div><h2 id="build-title">正在把想法变成作品</h2><p id="build-copy">AI 正在理解你的需求，并搭起第一个可运行版本。</p><div class="steps"><div class="step on" id="s1"><b>1</b>理解你的想法</div><div class="step" id="s2"><b>2</b>设计界面与交互</div><div class="step" id="s3"><b>3</b>让它在手机里跑起来</div></div></div></section>
  <section class="screen studio" id="studio"><header class="studio-head"><button class="icon-btn" id="home" aria-label="返回首页">←</button><span class="project-dot"></span><div class="project"><b id="project-name">随机抽签器</b><span>已保存 · 现在正在运行</span></div><button class="icon-btn" id="full" aria-label="全屏浏览">⛶</button><button class="icon-btn" id="share" aria-label="分享作品">↗</button><button class="icon-btn" id="code" aria-label="查看代码">&lt;/&gt;</button></header><div class="preview-wrap"><div class="preview-label"><span>你的作品预览</span><span class="live">运行中</span></div><div class="app-frame"><iframe id="preview" title="应用预览" sandbox="allow-scripts"></iframe></div></div><div class="workspace"><div class="suggestions"><button>按钮改成蓝色</button><button>加历史记录</button><button>背景变黑</button></div><div class="change-box"><textarea id="change" aria-label="描述你要修改的内容" placeholder="继续说：把这里改成…"></textarea><button class="send" id="send" aria-label="发送修改">↑</button></div><p class="ai-note" id="ai-note">AI 已准备好继续修改。</p></div></section>
  <section class="screen full-preview" id="full-preview"><header class="studio-head"><button class="icon-btn" id="exit-full" aria-label="退出全屏浏览">←</button><div class="project"><b id="full-name">你的作品</b><span>全屏预览</span></div><span class="live">运行中</span></header><iframe id="full-frame" title="作品全屏预览" sandbox="allow-scripts" style="border:0;flex:1;width:100%;background:#fff"></iframe></section>
  <div class="sheet-backdrop" id="backdrop"></div><aside class="sheet" id="sheet"><div class="handle"></div><div class="sheet-title"><h3 id="sheet-heading">代码</h3><button class="close" id="close">×</button></div><div id="sheet-body"></div></aside>
</main>
<script>
const apps={
 lottery:{name:'今天谁请客？', title:'随机抽签器', prompt:'做一个能从 10 个人里随机抽一人的小工具', html:`<div class="lottery"><small>今日幸运签</small><h1>今天谁请客？</h1><div id="person">点击开始</div><button onclick="pick()">抽一个人</button><p id="history"></p></div><script>const names=['小陈','阿明','小林','小雨','可可','老王','安妮','小周','小吴','米粒'];let hist=[];function pick(){let n=names[Math.floor(Math.random()*names.length)];document.querySelector('#person').textContent=n;hist.unshift(n);document.querySelector('#history').textContent=hist.length>1?'刚刚抽过：'+hist.slice(1,4).join('、'):''}<\/script>`, css:`body{margin:0;font-family:system-ui,'Microsoft YaHei';display:grid;place-items:center;min-height:100vh;background:#fff8e8;color:#252019}.lottery{text-align:center;padding:25px}small{color:#9b7a35;font-weight:700}h1{font-size:27px;margin:9px 0 23px}#person{font-size:41px;font-weight:850;min-height:58px;color:#e85d39}button{border:0;background:#252019;color:#fff;padding:13px 25px;border-radius:14px;font-weight:800;font-size:16px;box-shadow:0 6px 0 #0e0c0a;margin-top:17px}button:active{transform:translateY(4px);box-shadow:0 2px 0 #0e0c0a}p{font-size:12px;color:#917e60;min-height:18px}`},
 pomodoro:{name:'专注一下', title:'番茄钟', prompt:'做一个简洁的 25 分钟专注番茄钟', html:`<div class="pomo"><div class="topline">🍅 专注一下</div><div class="ring"><b id="time">25:00</b><span>专注时间</span></div><button onclick="start()" id="start">开始专注</button><p>今天已完成 <b>2</b> 个番茄</p></div><script>let running=false,t=1500,job;function start(){if(running)return;running=true;document.querySelector('#start').textContent='专注中…';job=setInterval(()=>{t--;let m=String(Math.floor(t/60)).padStart(2,'0'),s=String(t%60).padStart(2,'0');document.querySelector('#time').textContent=m+':'+s;if(!t)clearInterval(job)},1000)}<\/script>`, css:`body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fcf5f3;font-family:system-ui,'Microsoft YaHei';color:#352c2b}.pomo{text-align:center}.topline{font-weight:800}.ring{width:174px;height:174px;border:10px solid #f58a74;border-left-color:#fde2da;border-radius:50%;margin:20px auto;display:grid;place-content:center}.ring b{font-size:39px;letter-spacing:-2px}.ring span{font-size:12px;color:#9a7770;margin-top:2px}button{background:#ec6e58;color:white;border:0;border-radius:13px;padding:13px 25px;font-weight:800;font-size:15px}p{font-size:13px;color:#8f7771}p b{color:#e45e47}`},
 split:{name:'这顿 AA 一下', title:'AA 计算器', prompt:'做一个方便朋友聚餐时算 AA 的计算器', html:`<div class="split"><h1>这顿 AA 一下</h1><label>总金额<input id="total" type="number" value="268" oninput="calc()"><em>¥</em></label><label>用餐人数<input id="count" type="number" value="4" oninput="calc()"><em>人</em></label><div class="result"><span>每人应付</span><b>¥ <i id="each">67.00</i></b></div><button onclick="navigator.clipboard&&navigator.clipboard.writeText(document.querySelector('#each').textContent)">复制金额</button></div><script>function calc(){let a=+document.querySelector('#total').value,n=+document.querySelector('#count').value;document.querySelector('#each').textContent=n?(a/n).toFixed(2):'0.00'}<\/script>`, css:`body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5ff;color:#18233a;font-family:system-ui,'Microsoft YaHei'}.split{width:min(290px,82vw)}h1{font-size:27px;margin:0 0 23px}label{display:block;position:relative;color:#65728a;font-size:12px;font-weight:700;margin:12px 0}input{display:block;width:100%;border:1px solid #d9e0ed;border-radius:12px;margin-top:6px;background:white;padding:13px 34px 13px 13px;font-size:18px;font-weight:800;color:#243451;outline-color:#5d82ff}em{position:absolute;right:14px;bottom:13px;font-style:normal;color:#8994a7}.result{margin:20px 0 14px;border-radius:16px;padding:16px;background:#dfe8ff}.result span{display:block;font-size:12px;color:#6275a1}.result b{display:block;font-size:27px;margin-top:4px}.result i{font-style:normal}button{width:100%;border:0;border-radius:12px;padding:13px;background:#3e6cf4;color:white;font-weight:800}`}
};
let current=apps.lottery, edits={blue:false,history:false,dark:false}; const $=s=>document.querySelector(s);
function doc(){let css=current.css; if(edits.blue) css+='button{background:#3672ff!important;box-shadow:none!important}';if(edits.dark) css+='body{background:#111827!important;color:#f8fafc!important}.lottery small,.lottery p{color:#b7c2d5!important}input{background:#1e293b!important;color:#fff!important;border-color:#334155!important}.result{background:#1e3a8a!important}';let html=current.html;if(edits.history&&current===apps.lottery) html=html.replace('<p id="history"></p>','<p id="history">抽签历史会显示在这里</p>');return '<!doctype html><html><head><style>'+css+'</style></head><body>'+html+'</body></html>'}
function source(){return '<!-- index.html -->\n'+current.html.replace(/<script>[\s\S]*?<\\\/script>/,'')+'\n\n/* style.css */\n'+current.css+'\n\n// app.js\n// 交互逻辑已内联，打开页面即可运行。'}
 function render(){ $('#preview').srcdoc=doc(); $('#project-name').textContent=current.name; $('#full-name').textContent=current.name; }
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active')}
function launch(key){current=apps[key]||apps.lottery;edits={blue:false,history:false,dark:false};$('#build-title').textContent='正在把想法变成作品';$('#build-copy').textContent='AI 正在理解你的需求，并搭起第一个可运行版本。';show('build');[0,650,1350].forEach((ms,i)=>setTimeout(()=>$('#s'+(i+1)).classList.add('on'),ms));setTimeout(()=>{render();show('studio')},2150)}
$('#generate').onclick=()=>{let t=$('#prompt').value;let key=/番茄|专注|计时/.test(t)?'pomodoro':/AA|算钱|聚餐|分摊/.test(t)?'split':'lottery';launch(key)};
document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{ $('#prompt').value=apps[x.dataset.app].prompt; launch(x.dataset.app) });
function modify(text){let message='我已更新预览。';if(/蓝/.test(text)){edits.blue=true;message='按钮已换成蓝色。'}else if(/历史/.test(text)){edits.history=true;message='已加入抽签历史记录。'}else if(/黑|暗/.test(text)){edits.dark=true;message='已切换为深色背景。'}else message='我已根据你的描述优化了这个版本。';render();$('#ai-note').textContent='✦ '+message;$('#change').value='';}
$('#send').onclick=()=>modify($('#change').value); $('#change').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();modify(e.target.value)}});document.querySelectorAll('.suggestions button').forEach(x=>x.onclick=()=>modify(x.textContent));
function openSheet(kind){$('#sheet-heading').textContent=kind==='code'?'真实代码':'分享你的作品';$('#sheet-body').innerHTML=kind==='code'?'<pre>'+escapeHtml(source())+'</pre>':'<p class="share-content">你的作品已经有了一个专属链接。发给朋友，让他们也试试看。</p><div class="fake-link">pocket.dev/s/'+Math.random().toString(36).slice(2,8)+'</div><button class="copy" id="copy">复制链接</button>';$('#backdrop').classList.add('show');$('#sheet').classList.add('show');if(kind==='share')$('#copy').onclick=()=>{navigator.clipboard?.writeText('https://pocket.dev/your-app');$('#copy').textContent='已复制 ✓'};}
 function escapeHtml(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))} $('#code').onclick=()=>openSheet('code');$('#share').onclick=()=>openSheet('share');$('#home').onclick=()=>show('welcome');$('#full').onclick=()=>{ $('#full-frame').srcdoc=doc();show('full-preview');document.documentElement.requestFullscreen?.().catch(()=>{});};$('#exit-full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();show('studio')};function close(){ $('#backdrop').classList.remove('show');$('#sheet').classList.remove('show') }$('#close').onclick=close;$('#backdrop').onclick=close;
</script>
</body>
</html>
